[project]
name = "linkedin-agent"
version = "0.1.0"
description = "AI agent for LinkedIn profile management and content strategy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.0.0",
    "langchain-anthropic>=0.3.10",
    "langgraph>=0.3.18",
    "langchain-community>=0.3.20",
    "langchain-openai>=0.3.9",
    "pinecone>=5.0.0",
    "tavily-python>=0.5.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
